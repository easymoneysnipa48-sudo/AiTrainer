name: Nightly Eval

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install torch (CPU) + full deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Rebuild the eval set (with adversarial + negatives + paraphrases)
        run: |
          python -m musictrain evalset --force --adversarial 4 --negatives 3 --paraphrases 2

      - name: Run the full eval suite (3 seeds, majority verdicts)
        run: |
          python -m musictrain eval --seeds 3 --incremental

      - name: Rebuild leaderboard + export report
        run: |
          python -m musictrain leaderboard || true
          python -m musictrain report || true
          python -m musictrain adherence || true

      - name: Alert on regression
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python -m musictrain alert --min-clap 0.30 --max-dev 0.20 --min-ok 0.5 \
            --slack-webhook "${SLACK_WEBHOOK}" || true

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            metadata/eval_results.jsonl
            metadata/leaderboard.json
            metadata/eval_report.html
          if-no-files-found: warn
