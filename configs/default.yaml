normalize:
  sample_rate: 32000
  channels: 1
  codec: pcm_s16le
  strip_metadata: true
  target_lufs: null
  extensions:
  - .wav
  - .mp3
  - .flac
  - .m4a
  - .aiff
  - .aif
segment:
  segment_seconds: 30.0
  bar_aligned: true
  beats_per_bar: 4
  min_segment_seconds: 8.0
features:
  sr: 32000
  hop_length: 512
  silence_threshold_db: -60.0
  clip_threshold: 0.999
split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42
  mode: copy
inference:
  model_name: facebook/musicgen-small
  device: mps
  torch_dtype: float32
  do_sample: true
  guidance_scale: 3.0
  max_new_tokens: 256
  temperature: 1.0
  top_k: 250
  seed: null
check:
  bpm_tolerance: 0.05
  max_time_stretch: 0.1
  beats_per_bar: 4
  sr: 32000
mlflow:
  enabled: true
  tracking_uri: ''
  experiment_name: musicgen-style
clap:
  enabled: true
  model_name: laion/clap-htsat-unfused
  device: auto
quality:
  min_bitrate_kbps: 128.0
  min_sample_rate: 32000
  max_clipping_ratio: 0.001
  max_silence_ratio: 0.5
  max_dc_offset: 0.01
  min_rolloff_hz: 4000.0
dedup:
  threshold: 0.97
  exact_only: false
  action: report
autolabel:
  enabled: true
  top_k: 3
  min_confidence: 0.15
  device: auto
ood:
  bpm_range:
  - 70.0
  - 160.0
  action: report
  tag_exclude:
  - ambient
  - orchestral
stems:
  model: htdemucs
  device: auto
  two_stems: false
  segment_seconds: null
