normalize:
  sample_rate: 32000
  channels: 1
  codec: pcm_s16le
  strip_metadata: true
  target_lufs: null
  extensions:
  - .wav
  - .mp3
  - .flac
  - .m4a
  - .aiff
  - .aif
segment:
  segment_seconds: 30.0
  bar_aligned: true
  beats_per_bar: 4
  min_segment_seconds: 8.0
  downbeat_aligned: false
  overlap_seconds: 0.0
  fade_seconds: 0.0
features:
  sr: 32000
  hop_length: 512
  silence_threshold_db: -60.0
  clip_threshold: 0.999
split:
  train: 0.8
  val: 0.1
  test: 0.1
  seed: 42
  mode: copy
  stratify: ''
  k_folds: 0
inference:
  model_name: facebook/musicgen-small
  device: mps
  torch_dtype: float32
  do_sample: true
  guidance_scale: 3.0
  max_new_tokens: 256
  temperature: 1.0
  top_k: 250
  top_p: 1.0
  seed: null
  preset: ''
  presets:
    standard: {temperature: 1.0, top_k: 250, top_p: 1.0, guidance_scale: 3.0}
    creative: {temperature: 1.2, top_k: 400, top_p: 0.98, guidance_scale: 2.0}
    precise: {temperature: 0.7, top_k: 120, top_p: 0.95, guidance_scale: 4.5}
  target_seconds: null
  negative_prompt: ''
  negative_threshold: 0.25
  negative_retries: 0
check:
  bpm_tolerance: 0.05
  max_time_stretch: 0.1
  beats_per_bar: 4
  sr: 32000
mlflow:
  enabled: true
  tracking_uri: ''
  experiment_name: musicgen-style
clap:
  enabled: true
  model_name: laion/clap-htsat-unfused
  device: auto
quality:
  min_bitrate_kbps: 128.0
  min_sample_rate: 32000
  max_clipping_ratio: 0.001
  max_silence_ratio: 0.5
  max_dc_offset: 0.01
  min_rolloff_hz: 4000.0
dedup:
  threshold: 0.97
  exact_only: false
  action: report
autolabel:
  enabled: true
  top_k: 3
  min_confidence: 0.15
  device: auto
ood:
  bpm_range:
  - 70.0
  - 160.0
  action: report
  tag_exclude:
  - ambient
  - orchestral
stems:
  model: htdemucs
  device: auto
  two_stems: false
  segment_seconds: null
analysis:
  sr: 32000
  hop_length: 512
  chord_frame: 0.5
  beats_per_bar: 4
  structure_min_segments: 2
  structure_max_segments: 8
  structure_segment_seconds: 10.0
  vocal_enabled: true
  key_top_k: 3
export:
  format: arrow
  which: all
  audio_column: true
  max_shard_size: 500MB
