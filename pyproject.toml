[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "musictrain"
version = "0.1.0"
description = "MusicGen fine-tuning control-plane toolkit for Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "soundfile",
    "librosa",
    "pydub",
    "tqdm",
    "pyyaml",
    "jsonlines",
    "pyloudnorm",
    "transformers",
    "accelerate",
    "safetensors",
    "streamlit",
    "matplotlib",
    "mlflow",
]

[project.optional-dependencies]
stems = ["demucs"]
export = ["datasets"]

[project.scripts]
musictrain = "musictrain.cli:main"

[tool.setuptools.packages.find]
include = ["musictrain*"]
